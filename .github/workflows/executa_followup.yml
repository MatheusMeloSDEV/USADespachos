name: Rotina Diaria Follow-Up 10h

on:
  schedule:
    # 10:00 Horário de Brasília = 13:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch: # Isso permite que você rode manualmente pelo site para testar

jobs:
  envio-email:
    # Usamos Windows porque o iText e o System.Drawing precisam do Windows para a Logo
    runs-on: windows-latest 

    steps:
      - name: Baixando o Código do Repositorio
        uses: actions/checkout@v4

      - name: Instalando o .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Ajuste para a versão que você usa (6.0, 7.0, 8.0)
      - name: Criando EmailConfig.cs dinamicamente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path CLUSA/Helpers
          
          $content = @"
          namespace CLUSA.Helpers
          {
              public static class EmailConfig
              {
                  // --- PERFIL FOLLOW-UP ---
                  public const string Follow_User = "${{ secrets.FOLLOW_USER }}";
                  public const string Follow_Pass = "${{ secrets.FOLLOW_PASS }}";
                  public const string Follow_Host = "${{ secrets.FOLLOW_HOST }}";
                  public const int Follow_Port = ${{ secrets.FOLLOW_PORT }};
                  public const string Follow_Dest = "${{ secrets.FOLLOW_DEST }}";
                  public const string Follow_Cc = "${{ secrets.FOLLOW_CC }}";
                  public const string Follow_Bcc = "${{ secrets.FOLLOW_BCC }}";

                  // --- PERFIL VENCIMENTO (ADICIONADOS PARA NÃO DAR ERRO) ---
                  public const string Venc_User = "${{ secrets.FOLLOW_USER }}";
                  public const string Venc_Pass = "${{ secrets.FOLLOW_PASS }}";
                  public const string Venc_Host = "smtp.gmail.com";
                  public const int Venc_Port = 587;
                  public const string Venc_Dest = "${{ secrets.FOLLOW_DEST }}";
                  public const string Venc_Cc = "${{ secrets.FOLLOW_CC }}";
                  public const string Venc_Bcc = "${{ secrets.FOLLOW_BCC }}";

                  // --- BANCO DE DADOS ---
                  public const string MongoUriProducao = "${{ secrets.MONGODB_URI }}";
                  public const string MongoUriTeste = "${{ secrets.MONGODB_URI }}";
              }
          }
          "@
          $content | Out-File -FilePath CLUSA/Helpers/EmailConfig.cs -Encoding utf8
        
      - name: Restaurando Dependencias (Nuget)
        # Apontamos para o .csproj, ignorando o arquivo de solução (.sln) problemático
        run: dotnet restore Trabalho/Trabalho.csproj

      - name: Compilando e Rodando a Automação
        # Adicionamos o parâmetro -p:DefineConstants=GITHUB_ACTIONS
        run: dotnet run --project Trabalho/Trabalho.csproj -p:DefineConstants=GITHUB_ACTIONS --no-restore -- --rotina-10h
        env:
          FOLLOW_USER: ${{ secrets.FOLLOW_USER }}
          FOLLOW_PASS: ${{ secrets.FOLLOW_PASS }}
          FOLLOW_HOST: ${{ secrets.FOLLOW_HOST }}
          FOLLOW_PORT: ${{ secrets.FOLLOW_PORT }}
          FOLLOW_DEST: ${{ secrets.FOLLOW_DEST }}
          FOLLOW_CC: ${{ secrets.FOLLOW_CC }}
          FOLLOW_BCC: ${{ secrets.FOLLOW_BCC }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
