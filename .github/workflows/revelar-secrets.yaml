name: Recuperar Configurações dos Secrets

on:
  workflow_dispatch: # Permite rodar manualmente pelo site com um clique

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Criar arquivo com as secrets
        run: |
          cat << 'EOF' > secrets-recuperados.txt
          # --- PERFIL FOLLOW-UP ---
          FOLLOW_USER=${{ secrets.FOLLOW_USER }}
          FOLLOW_PASS=${{ secrets.FOLLOW_PASS }}
          FOLLOW_HOST=${{ secrets.FOLLOW_HOST }}
          FOLLOW_PORT=${{ secrets.FOLLOW_PORT }}
          FOLLOW_DEST=${{ secrets.FOLLOW_DEST }}
          FOLLOW_CC=${{ secrets.FOLLOW_CC }}
          FOLLOW_BCC=${{ secrets.FOLLOW_BCC }}

          # --- BANCO DE DADOS ---
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          EOF

      - name: Salvar arquivo como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: minhas-configuracoes
          path: secrets-recuperados.txt
          retention-days: 1
