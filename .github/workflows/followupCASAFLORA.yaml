name: Rotina Diaria Casa Flora

on:
  schedule:
    # 07:00 Horário de Brasília = 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo site para testar

jobs:
  envio-email:
    runs-on: windows-latest 

    steps:
      - name: Baixando o Código do Repositorio
        uses: actions/checkout@v4

      - name: Instalando o .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Criando EmailConfig.cs dinamicamente
        shell: pwsh
        env:
          F_USER: ${{ secrets.FOLLOW_USER }}
          F_PASS: ${{ secrets.FOLLOW_PASS }}
          F_HOST: ${{ secrets.FOLLOW_HOST }}
          F_PORT: ${{ secrets.FOLLOW_PORT }}
          F_DEST: ${{ secrets.FOLLOWCASAFLORA_DEST }}
          F_CC: ${{ secrets.FOLLOWCASAFLORA_CC }}
          F_BCC: ${{ secrets.FOLLOWCASAFLORA_BCC }}
          M_URI: ${{ secrets.MONGODB_URI }}
        run: |
          New-Item -ItemType Directory -Force -Path CLUSA/Helpers
          
          $content = @"
          namespace CLUSA.Helpers
          {
              public static class EmailConfig
              {
                  // --- PERFIL FOLLOW-UP ---
                  public const string Follow_User = "$($env:F_USER)";
                  public const string Follow_Pass = "$($env:F_PASS)";
                  public const string Follow_Host = "$($env:F_HOST)";
                  public const int Follow_Port = $($env:F_PORT);
                  public const string Follow_Dest = "$($env:F_DEST)";
                  public const string Follow_Cc = "$($env:F_CC)";
                  public const string Follow_Bcc = "$($env:F_BCC)";

                  // --- PERFIL VENCIMENTO ---
                  public const string Venc_User = "$($env:F_USER)";
                  public const string Venc_Pass = "$($env:F_PASS)";
                  public const string Venc_Host = "smtp.gmail.com";
                  public const int Venc_Port = 587;
                  public const string Venc_Dest = "$($env:F_DEST)";
                  public const string Venc_Cc = "$($env:F_CC)";
                  public const string Venc_Bcc = "$($env:F_BCC)";

                  // --- BANCO DE DADOS ---
                  public const string MongoUriProducao = "$($env:M_URI)";
                  public const string MongoUriTeste = "$($env:M_URI)";
              }
          }
          "@
          $content | Out-File -FilePath CLUSA/Helpers/EmailConfig.cs -Encoding utf8
        
      - name: Restaurando Dependencias (Nuget)
        run: dotnet restore Trabalho/Trabalho.csproj

      - name: Compilando e Rodando a Automação
        run: dotnet run --project Trabalho/Trabalho.csproj -p:DefineConstants=GITHUB_ACTIONS --no-restore -- --rotina-casaflora
        env:
          FOLLOW_USER: ${{ secrets.FOLLOW_USER }}
          FOLLOW_PASS: ${{ secrets.FOLLOW_PASS }}
          FOLLOW_HOST: ${{ secrets.FOLLOW_HOST }}
          FOLLOW_PORT: ${{ secrets.FOLLOW_PORT }}
          FOLLOW_DEST: ${{ secrets.FOLLOWCASAFLORA_DEST }}
          FOLLOW_CC: ${{ secrets.FOLLOWCASAFLORA_CC }}
          FOLLOW_BCC: ${{ secrets.FOLLOWCASAFLORA_BCC }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
